openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: newsletter
    description: Newsletter subscriptions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /newsletter/subscribe:
    post:
      operationId: subscribeToNewsletter
      tags: [newsletter]
      summary: Subscribe an email address to the B4P CODEFOUND newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscribeInput"
      responses:
        "200":
          description: Subscription accepted or the address is already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscriptionResult"
        "400":
          description: Invalid email address or missing marketing consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscriptionError"
        "409":
          description: The address cannot be resubscribed through this form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscriptionError"
        "503":
          description: Newsletter service is not configured or is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscriptionError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NewsletterSubscribeInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        marketingConsent:
          type: boolean
          enum: [true]
      required:
        - email
        - marketingConsent
    NewsletterSubscriptionResult:
      type: object
      properties:
        status:
          type: string
          enum: [pending, subscribed]
        message:
          type: string
      required:
        - status
        - message
    NewsletterSubscriptionError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

