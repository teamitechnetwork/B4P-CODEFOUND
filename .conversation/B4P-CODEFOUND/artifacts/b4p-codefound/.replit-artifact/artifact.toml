kind = "web"
previewPath = "/"
title = "B4P CODEFOUND"
description = "A modern, responsive nonprofit website for Business for Peace Community Development Foundation, sharing its mission, programs, community impact, and ways to get involved."
version = "1.0.0"
id = "artifacts/b4p-codefound"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20576

[services.development]
run = "pnpm --filter @workspace/b4p-codefound run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/b4p-codefound", "run", "build" ]
serve = "static"
publicDir = "artifacts/b4p-codefound/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20576"
BASE_PATH = "/"
